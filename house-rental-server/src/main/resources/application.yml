server:
  port: ${SERVER_PORT:8080}

ai:
  deepseek:
    base-url: https://api.deepseek.com
    model: deepseek-v4-flash
    api-key: ${DEEPSEEK_API_KEY:}
  agent:
    chat-url: ${AGENT_CHAT_URL:http://127.0.0.1:8001/api/agent/chat}
    stream-url: ${AGENT_STREAM_URL:http://127.0.0.1:8001/api/agent/chat/stream}
  recommend:
    embedding-url: ${EMBEDDING_RECOMMEND_URL:http://localhost:9000/semantic-recommend}

spring:
  application:
    name: house-rental-server

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/house_rental?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    encoding: UTF-8

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:5000}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:30MB}


app:
  demo:
    enabled: ${DEMO_ENABLED:false}
  session:
    # 本地 HTTP 调试为 false；HTTPS 部署必须显式设为 true。
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
  payment:
    demo-mode: ${PAYMENT_DEMO_MODE:false}
    app-name: ${PAYMENT_APP_NAME:house-rental-system}


  upload:
    base-dir: ${UPLOAD_BASE_DIR:./uploads}
