# 配合应用层账号配额；只使用连接来源，忽略客户端自行传入的转发头。
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;

    location = /api/auth/login {
        limit_req zone=login_per_ip burst=5 nodelay;
        proxy_pass http://backend:8080/auth/login;
        proxy_set_header Host $host;
    }

    location /api/agent/chat/stream {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://backend:8080/agent/chat/stream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
